<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" fill="none">
  <rect width="800" height="440" rx="16" fill="#FFFFFF"/>
  <!-- Left: Wireless Bioelectronic Device Schematic -->
  <rect x="28" y="28" width="356" height="384" rx="14" fill="#F7F6F2" stroke="#E4E1D9" stroke-width="1.5"/>
  <text x="52" y="62" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#6B6F7B" letter-spacing="0.08em">WIRELESS BIOELECTRONIC PLATFORM</text>

  <!-- Remote telemetry waves -->
  <path d="M96 118 C116 98, 144 98, 164 118" stroke="#2B50E6" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M106 130 C120 116, 140 116, 154 130" stroke="#2B50E6" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <circle cx="130" cy="144" r="5" fill="#2B50E6"/>
  <text x="178" y="128" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2242C4">BLE Closed-Loop Control</text>
  <text x="178" y="145" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B6F7B">Multi-channel dosing + onboard camera</text>

  <!-- Ring device cross-section -->
  <rect x="64" y="176" width="284" height="58" rx="12" fill="#ECEFFD" stroke="#2B50E6" stroke-width="2"/>
  <rect x="82" y="190" width="76" height="30" rx="6" fill="#2B50E6"/>
  <text x="120" y="209" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">PCB + BLE</text>
  <rect x="170" y="190" width="84" height="30" rx="6" fill="#7A3EE8"/>
  <text x="212" y="209" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Camera Sensor</text>
  <rect x="266" y="190" width="66" height="30" rx="6" fill="#0D9488"/>
  <text x="299" y="209" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Ion Pump</text>

  <!-- Fluoxetine ion delivery arrows -->
  <line x1="140" y1="238" x2="140" y2="282" stroke="#0D9488" stroke-width="2.2" stroke-dasharray="4 3"/>
  <polygon points="135,279 145,279 140,288" fill="#0D9488"/>
  <line x1="206" y1="238" x2="206" y2="282" stroke="#2B50E6" stroke-width="2.2" stroke-dasharray="4 3"/>
  <polygon points="201,279 211,279 206,288" fill="#2B50E6"/>
  <line x1="299" y1="238" x2="299" y2="282" stroke="#0D9488" stroke-width="2.2" stroke-dasharray="4 3"/>
  <polygon points="294,279 304,279 299,288" fill="#0D9488"/>
  <text x="206" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F766E">Fluoxetine H+ Iontophoresis</text>

  <!-- Porcine wound bed -->
  <rect x="64" y="294" width="284" height="86" rx="12" fill="#FDE8E8" stroke="#F5B5B5" stroke-width="1.5"/>
  <path d="M126 294 Q206 336 286 294" fill="#FBCFE8" stroke="#EC4899" stroke-width="2"/>
  <text x="206" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#881337">Porcine Excisional Wound Model</text>
  <text x="206" y="369" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9F1239">Accelerates re-epithelialization &amp; M2 shift</text>

  <!-- Right: Day-3 Quantitative Outcomes -->
  <rect x="408" y="28" width="364" height="384" rx="14" fill="#F7F6F2" stroke="#E4E1D9" stroke-width="1.5"/>
  <text x="432" y="62" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#6B6F7B" letter-spacing="0.08em">DAY-3 PORCINE OUTCOMES VS. CONTROL</text>

  <!-- Metric Card 1 -->
  <rect x="432" y="88" width="316" height="132" rx="12" fill="#FFFFFF" stroke="#E4E1D9"/>
  <text x="452" y="116" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#43464F">Re-epithelialization (Early Tissue Repair)</text>
  <text x="452" y="160" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#2B50E6">+37%</text>
  <rect x="576" y="138" width="148" height="12" rx="6" fill="#E4E1D9"/>
  <rect x="576" y="138" width="102" height="12" rx="6" fill="#9CA3AF"/>
  <rect x="576" y="158" width="148" height="12" rx="6" fill="#ECEFFD"/>
  <rect x="576" y="158" width="140" height="12" rx="6" fill="#2B50E6"/>
  <text x="452" y="198" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B6F7B">Relative increase over standard-of-care controls</text>

  <!-- Metric Card 2 -->
  <rect x="432" y="242" width="316" height="142" rx="12" fill="#FFFFFF" stroke="#E4E1D9"/>
  <text x="452" y="270" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#43464F">Macrophage M1 / M2 Inflammatory Ratio</text>
  <text x="452" y="316" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#0D9488">-33%</text>
  <rect x="576" y="290" width="148" height="12" rx="6" fill="#E4E1D9"/>
  <rect x="576" y="290" width="136" height="12" rx="6" fill="#9CA3AF"/>
  <rect x="576" y="310" width="148" height="12" rx="6" fill="#CCFBF1"/>
  <rect x="576" y="310" width="91" height="12" rx="6" fill="#0D9488"/>
  <text x="452" y="356" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B6F7B">Pro-reparative immune shift &amp; neuralsprouting</text>
</svg>
